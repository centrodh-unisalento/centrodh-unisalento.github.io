name: Retrieve Ciraci IRIS metadata
on:
  workflow_dispatch:
permissions: {}
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download public author catalogue
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p exports
          curl --fail --location --silent --show-error \
            --connect-timeout 20 --max-time 90 --retry 1 \
            --get 'https://iris.unisalento.it/browse' \
            --data-urlencode 'type=author' \
            --data-urlencode 'authority=rp01327' \
            --data-urlencode 'offset=0' \
            --data-urlencode 'sort_by=2' \
            --data-urlencode 'order=DESC' \
            --data-urlencode 'rpp=500' \
            --data-urlencode 'etal=-1' \
            --output exports/ciraci.html
          grep -q '/handle/11587/' exports/ciraci.html
      - name: Attach public metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ciraci-iris-catalogue
          path: exports/
          if-no-files-found: error
          retention-days: 1
